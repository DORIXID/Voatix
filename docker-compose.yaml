version: '3.8'

services:

  db:
    image: postgres:17-alpine3.22
    container_name: voatix_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: Voatix
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: voatix_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001" # Консоль
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set VoatixMinioDB http://minio:9000 minioadmin minioadmin) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing VoatixMinioDB/images;
      /usr/bin/mc policy set public VoatixMinioDB/images;
      exit 0;
      "

  backend:
    build:
      context: ./VoatixBack
    container_name: voatix_backend
    restart: always
    depends_on:
      - db
      - minio
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/Voatix
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      # Переменные для Minio (для спринга)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8080:8080"

  # frontend:
  #   build:
  #     context: ./VoatixFront
  #   container_name: voatix_frontend
  #   restart: always
  #   depends_on:
  #     - backend
  #   ports:
  #     - "4200:4200"
  #   volumes:
  #     - ./VoatixFront:/app
  #     - /app/node_modules
  #   environment:
  #     - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data:
  minio_data: