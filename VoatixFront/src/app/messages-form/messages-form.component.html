<div class="rightSideDiv">
    <div class="headlineDiv" style="height: 90px;">
        <h1 style="margin-top: 20px;">Сообщения</h1>
    </div>
    <div class="messages-wrapper">
        <!-- Chats List -->
        <div class="headlineDiv chats-section" style="height: 690px; margin-top: 20px;">
            <div class="chats-container">
                <div class="chats-list" *ngIf="!loading && chats.length > 0">
                    <div
                        class="chat-item"
                        *ngFor="let chat of chats"
                        (click)="selectChat(chat)"
                        [class.active]="selectedChat?.userNickname === chat.userNickname"
                    >
                        <div class="chat-avatar">
                            <img [src]="getAvatarUrl(chat.avatarKey)" alt="avatar" class="avatar-img">
                        </div>
                        <div class="chat-content">
                            <div class="chat-header">
                                <span class="chat-nickname">{{ chat.userNickname }}</span>
                                <span class="chat-date">{{ chat.dateTime | date:'dd.MM.yy HH:mm' }}</span>
                            </div>
                            <div class="chat-message">
                                <span class="sender-name">{{ chat.senderNickname }}:</span>
                                <span class="message-text">{{ chat.text }}</span>
                            </div>
                        </div>
                        <div class="chat-unread" *ngIf="chat.unreadCount > 0">
                            <span class="unread-badge">{{ chat.unreadCount }}</span>
                        </div>
                    </div>
                </div>
                <div *ngIf="!loading && chats.length === 0" style="padding:16px; color:#666;">
                    Нет сообщений
                </div>
                <div *ngIf="loading" style="padding:16px; color:#666;">
                    Загрузка...
                </div>
                <div class="chats-pagination" *ngIf="totalPages > 1">
                    <button class="pag-btn" (click)="prev()" [disabled]="page <= 0">←</button>
                    <span class="pag-info">{{ page + 1 }} / {{ totalPages }}</span>
                    <button class="pag-btn" (click)="next()" [disabled]="page >= totalPages - 1">→</button>
                </div>
            </div>
        </div>

        <!-- Chat Detail View -->
        <div *ngIf="selectedChat" class="chat-detail-section">
            <div class="chat-detail-header">
                <button class="back-btn" (click)="closeChat()">
                    <span>←</span>
                </button>
                <h3>{{ selectedChat.userNickname }}</h3>
            </div>
            <chat-detail-component
                [chatNickname]="selectedChat.userNickname"
                [currentUsername]="currentUsername"
                [avatarKey]="selectedChat.avatarKey"
                [wsService]="getWebSocketService()"
                [senderName]="selectedChat.senderNickname"
            ></chat-detail-component>
        </div>

        <!-- Empty State Background -->
        <div *ngIf="!selectedChat" class="chat-detail-empty"></div>
    </div>
</div>
